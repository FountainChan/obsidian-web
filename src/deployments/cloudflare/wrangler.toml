name = "obsidian-web-fountainchan"
compatibility_date = "2025-01-01"
main = "index.js"

# ── Browser file system (OPFS) deployment ─────────────────────────────────────
# Vaults live ENTIRELY in the browser (OPFS). There is NO Durable Object /
# server-side vault storage — this is a client-only static deployment. The
# Worker only serves the static asset bundle. See index.js for the follow-up
# (porting the proxy + system-plugin-seed routes to the Worker).

# Uncomment and set your own domain:
routes = [
  { pattern = "note.vastnext.com/*", zone_name = "vastnext.com" }
]

# Build output lives outside src/ in the repo's gitignored .tmp/ tree.
# Generated by: scripts/build-assets.sh (run via `npm run build`).
[assets]
directory = "../../../.tmp/deployments/cloudflare/public"
# 不存在的路径返回 index.html（SPA 路由），避免 Cloudflare Static Assets
# 默认抛 Error 1101（如 GET /api/proxy-request 之类未匹配静态文件的请求）
not_found_handling = "single-page-application"

# ── FOLLOW-UP env (once the proxy/seed Worker routes exist) ────────────────────
# [vars]
# SYSTEM_PLUGINS_SEED_DISABLED = "obsidian-livesync"   # pre-install LiveSync, disabled
